name: Deploy Hanan bot

# מעלה את הבוט של חנן ל-Cloudflare בכל שינוי בקוד שלו, בלי טרמינל.
# הסודות נלקחים מ-GitHub: Settings → Secrets and variables → Actions.
on:
  push:
    branches: [main, claude/bold-knuth-scehxs]
    paths:
      - 'bots/hanan-locksmith/**'
      - '.github/workflows/hanan-bot.yml'
  workflow_dispatch:
    inputs:
      send_table:
        description: 'Send the customer table link to the owner on WhatsApp'
        type: boolean
        default: false
      show_forms:
        description: 'Print the latest owner form answers in the log'
        type: boolean
        default: false
      test_email:
        description: 'Send one test email to OWNER_EMAIL'
        type: boolean
        default: false
      run_demos:
        description: 'Run all demo conversations with the real AI (costs a little; on a normal deploy only the first one runs)'
        type: boolean
        default: false
      demo_list:
        description: 'Run only these demo conversations, by number (for example 1,3,2). Empty = default'
        type: string
        default: ''
      daily_check:
        description: 'Daily check only: nothing is deployed or sent, just prints the bot state (used every morning)'
        type: boolean
        default: false
      run_setup:
        description: 'Check the WhatsApp connection and create the message templates (connection day)'
        type: boolean
        default: false

concurrency:
  group: hanan-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/hanan-locksmith
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Daily check (nothing is deployed or sent)
        if: github.event.inputs.daily_check == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "===== health ====="
          curl -s -m 20 "$url/health"; echo
          echo "===== daily report ====="
          curl -s -m 60 -G "$url/admin/daily" --data-urlencode "key=$key"; echo
          echo "===== connection check (read only) ====="
          curl -s -m 120 -G "$url/admin/setup" --data-urlencode "key=$key" --data-urlencode "check=1"; echo

      - name: Check setup
        id: ready
        run: |
          if [ "${{ github.event.inputs.daily_check }}" = "true" ]; then
            echo "::notice::daily check only, nothing is deployed"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet, skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_DATABASE_ID' wrangler.toml; then
            echo "::notice::database_id in wrangler.toml not set yet, skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Who am I (account and token permissions, no secrets)
        if: steps.ready.outputs.go == 'true'
        run: |
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami || true

      - name: Database tables (migrations)
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply hanan-bot --remote

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy

      - name: Secrets
        if: steps.ready.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          D360_API_KEY: ${{ secrets.D360_API_KEY }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          YESH_USERKEY: ${{ secrets.YESH_USERKEY }}
          YESH_SECRET: ${{ secrets.YESH_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DUALHOOK_API_KEY: ${{ secrets.DUALHOOK_API_KEY }}
          DUALHOOK_WEBHOOK_KEY: ${{ secrets.DUALHOOK_WEBHOOK_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY WA_TOKEN WA_VERIFY_TOKEN WA_APP_SECRET GOOGLE_SA_JSON YESH_USERKEY YESH_SECRET D360_API_KEY ULTRAMSG_TOKEN GMAIL_APP_PASSWORD DUALHOOK_API_KEY DUALHOOK_WEBHOOK_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::notice::$name is not set in GitHub secrets yet"
            fi
          done

      - name: Connection check and message templates
        if: steps.ready.outputs.go == 'true' && github.event.inputs.run_setup == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          sleep 20
          curl -s -m 120 -G "$url/admin/setup" --data-urlencode "key=$key"

      - name: Self-test (the real AI answers sample customers, nothing is sent)
        if: steps.ready.outputs.go == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          if [ -z "$url" ] || [ -z "$WA_VERIFY_TOKEN" ]; then echo "::notice::WORKER_URL or WA_VERIFY_TOKEN missing, skipping self-test"; exit 0; fi
          sleep 20
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          out=$(curl -s -m 90 -G "$url/admin/selftest" --data-urlencode "key=$key")
          echo "$out"
          curl -s -m 20 "$url/health"
          echo "$out" | grep -q '^OK מסד' && ! echo "$out" | grep -q '^FAIL'

      - name: Demo conversations (real AI, nothing is sent; all of them only with run_demos)
        if: steps.ready.outputs.go == 'true'
        continue-on-error: true
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          n=$(curl -s -m 20 -G "$url/admin/demo" --data-urlencode "key=$key" --data-urlencode "s=list" || echo 1)
          case "$n" in ''|*[!0-9]*) n=1;; esac
          # כל ההעלאה הרגילה: רק שיחה אחת לדוגמה (חוסך כסף). כל השיחות רק כשמבקשים
          [ "${{ github.event.inputs.run_demos }}" = "true" ] || n=1
          list=$(seq 0 $((n-1)))
          # רק שיחות מסוימות (מספרים מ-1): demo_list
          picked="${{ github.event.inputs.demo_list }}"
          if [ -n "$picked" ]; then list=$(echo "$picked" | tr ',' '\n' | grep -E '^[0-9]+$' | awk '{print $1-1}'); fi
          for i in $list; do
            curl -s -m 120 -G "$url/admin/demo" --data-urlencode "key=$key" --data-urlencode "s=$i"
          done

      - name: Test email (manual)
        if: steps.ready.outputs.go == 'true' && github.event.inputs.test_email == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          out=$(curl -s -m 60 -X POST -G "$url/admin/test-email" --data-urlencode "key=$key")
          echo "$out"
          echo "$out" | grep -q '^OK'

      - name: Show owner form answers (manual)
        if: steps.ready.outputs.go == 'true' && github.event.inputs.show_forms == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          curl -s -m 30 -G "$url/admin/forms" --data-urlencode "key=$key"

      - name: Send the table link to the owner (manual)
        if: steps.ready.outputs.go == 'true' && github.event.inputs.send_table == 'true'
        env:
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          url=$(grep -E '^WORKER_URL' wrangler.toml | cut -d'"' -f2)
          key=$(printf '%s' "$WA_VERIFY_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          curl -s -m 30 -X POST -G "$url/admin/send-table" --data-urlencode "key=$key"
