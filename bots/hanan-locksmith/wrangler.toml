name = "hanan-locksmith-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# הכתובת שלנו (קישורים במיילים לחנן): workers.dev נחסם אצל ספקי אינטרנט ובנטפרי.
# הכתובת הישנה נשארת דלוקה: ה-webhook של Dualhook עדיין שולח אליה
workers_dev = true
routes = [{ pattern = "bot.onerishon.com", custom_domain = true }]

# כל 15 דקות: תזכורות, מעקבים, ביקורות. כל יום ראשון 06:00 UTC (09:00 בישראל): דוח שבועי.
[triggers]
crons = ["* * * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hanan-bot"
database_id = "07f9c174-05b0-4187-a574-38fe41f09746"
migrations_dir = "migrations"

# תמלול הודעות קוליות
[ai]
binding = "AI"

[vars]
# meta = ישירות מול Meta. 360dialog = דרך הספק (למספר האמיתי, שעובד גם באפליקציה)
# ultramsg = וואטסאפ רגיל דרך UltraMsg (סריקת QR). לא רשמי: יש סיכון לחסימת המספר
# dualhook = ספק רשמי וזול: המספר עובד גם באפליקציה וגם בבוט (סודות: DUALHOOK_API_KEY, DUALHOOK_WEBHOOK_KEY)
WA_PROVIDER = "dualhook"
# UltraMsg: מספר ה-Instance (לא סוד). הטוקן נכנס כסוד ULTRAMSG_TOKEN
ULTRAMSG_INSTANCE = "instance194049"
# מצב בדיקה: הבוט עונה רק למספרים האלה (ולחנן). "none" = לא עונה לאף לקוח. ריק = עונה לכולם
TEST_PHONES = ""
# "1" = הבוט כבוי לגמרי: לא עונה לאף אחד ולא שולח כלום
BOT_OFF = "0"
# כמה דקות של שקט מהלקוח לפני שחנן מקבל סיכום אחד של כל השיחה (דחוף: מיד)
SUMMARY_SETTLE_MIN = "3"
# "1" = הודעה מבעל העסק שהיא לא פקודה לא מקבלת תגובה (כשהמספר שלו משמש גם לשיחות רגילות)
OWNER_QUIET = "1"
# הכתובת של הבוט (בשביל חיבור אוטומטי של UltraMsg)
WORKER_URL = "https://bot.onerishon.com"
# מזהה חשבון הוואטסאפ העסקי ומזהה האפליקציה ב-Meta (לא סודות). בשביל /admin/setup
WABA_ID = "1121041376942376"
META_APP_ID = ""
# בבדיקה: המספר של אריאל (052-4666175) דרך Dualhook. ביום החיבור: המספר של חנן
WA_PHONE_NUMBER_ID = "1308345192370593"
# הטלפון של חנן לקבלת סיכומים ופקודות בוואטסאפ (פורמט בינלאומי, בלי +). ריק = הכל במייל (OWNER_EMAIL)
OWNER_PHONE = ""
# התראות לחנן במייל. נשלחות מהג'ימייל של העסק (הסיסמה נכנסת רק כסוד GMAIL_APP_PASSWORD ב-GitHub)
GMAIL_USER = "eliyabuis12@gmail.com"
# בזמן הבדיקות הסיכומים מגיעים אלינו. ביום החיבור מחליפים למייל של חנן: Hananlocks@gmail.com
OWNER_EMAIL = "Hananlocks@gmail.com"
# מי מקבל התראה בוואטסאפ כשיש תקלה בבוט. ריק בבדיקה: המספר של אריאל הוא עכשיו המספר של הבוט
ADMIN_PHONE = ""
# ID של גיליון הלקוחות בגוגל (ריק = בלי גיליון)
SHEET_ID = ""
# קישור לכתיבת ביקורת בגוגל
REVIEW_LINK = "https://g.page/r/CRb_LFlSkhYQEBI/review"
# שמות התבניות המאושרות ב-WhatsApp Manager (להודעות מחוץ לחלון 24 שעות)
TEMPLATE_LANG = "he"
# המוח של הבוט. Sonnet: חצי מחיר מ-Opus ומדויק. זול יותר: claude-haiku-5-5. הכי חזק: claude-opus-5-5
CLAUDE_MODEL = "claude-sonnet-5-5"

# סודות (לא כאן! מכניסים עם: wrangler secret put <NAME>)
# WA_TOKEN            טוקן קבוע של System User ב-Meta
# WA_VERIFY_TOKEN     מחרוזת שאתם ממציאים, לאימות ה-Webhook
# WA_APP_SECRET       App Secret של האפליקציה ב-Meta (לבדיקת חתימה)
# ANTHROPIC_API_KEY   מפתח Claude
# GOOGLE_SA_JSON      כל התוכן של קובץ ה-JSON של ה-Service Account
# YESH_USERKEY        יש חשבונית: User Key (מהגדרות ה-API בחשבון של חנן)
# YESH_SECRET         יש חשבונית: Secret
# D360_API_KEY        360dialog (רק אם WA_PROVIDER = "360dialog")
# ULTRAMSG_TOKEN      UltraMsg (רק אם WA_PROVIDER = "ultramsg")

# יומן הבוט ב-Cloudflare (Workers Logs): Cloudflare ← הבוט ← Observability
[observability]
enabled = true
