<script>
/* ===== המחירון האמיתי של דוד (אותו קוד כמו בבוט), תקף עד 1/3/2027 ===== */
const DAVID_PRICES = {
  1: { one: 800, two: 600, thu: 1000, fm: 1500, fs: 1700, tm: 2200, kid: 0 },
  2: { one: 900, two: 700, thu: 1200, fm: 1500, fs: 1700, tm: 2200, kid: 0 },
  3: { one: 1200, two: 1000, thu: 1400, fm: 1700, fs: 2000, tm: 2600, kid: 100 },
};
const PRICES_VALID_UNTIL = '2027-03-01';
function priceStay(p, nights, { kids = 0, todayIso = '' } = {}) {
  const flags = [], lines = [];
  if (!nights.length) return { total: 0, lines, flags: ['no_nights'] };
  if (nights.some((n) => n.iso >= PRICES_VALID_UNTIL)) return { total: null, lines, flags: ['after_valid'] };
  if (nights.length > 6) return { total: null, lines, flags: ['long_stay'] };
  const mid = nights.filter((n) => n.dow <= 3), has = (d) => nights.some((n) => n.dow === d);
  const thu = has(4), fri = has(5), sat = has(6);
  let total = 0;
  if (thu && fri && sat) { const v = p.tm + (p.fs - p.fm); lines.push({ label: 'חמישי עד ראשון', price: v }); total += v; flags.push('thu_to_sun'); }
  else if (thu && fri) { lines.push({ label: 'חמישי עד מוצ"ש', price: p.tm }); total += p.tm; }
  else if (fri && sat) { lines.push({ label: 'שישי עד ראשון', price: p.fs }); total += p.fs; }
  else if (fri) { lines.push({ label: 'שישי עד מוצ"ש', price: p.fm }); total += p.fm; }
  else if (thu) { lines.push({ label: 'חמישי', price: p.thu }); total += p.thu; }
  else if (sat) { flags.push('sat_only'); return { total: null, lines, flags }; }
  if (mid.length) {
    const rate = nights.length >= 2 ? p.two : p.one;
    lines.push({ label: mid.length === 1 ? 'לילה באמצע שבוע' : `${mid.length} לילות באמצע שבוע`, price: rate * mid.length });
    total += rate * mid.length;
    if (thu || fri || sat) flags.push('mixed');
  }
  if (p.kid && kids > 0) { const v = p.kid * kids * nights.length; lines.push({ label: `תוספת ${kids === 1 ? 'ילד' : kids + ' ילדים'}`, price: v }); total += v; }
  if (nights.length >= 3) flags.push('extra_discount_3plus');
  if (todayIso && nights[0].iso <= todayIso) flags.push('last_minute');
  return { total, lines, flags };
}
const FLAG_TEXT = {
  thu_to_sun: 'חמישי עד ראשון: דוד יאשר את המחיר הסופי',
  mixed: 'שילוב של אמצע שבוע וסופ"ש: דוד יאשר את המחיר הסופי',
  extra_discount_3plus: 'ב-3 לילות ומעלה יש הנחה נוספת, דוד יחזור עם המחיר הסופי',
  last_minute: 'הזמנה של הרגע האחרון: דוד נותן מחיר',
  after_valid: 'לתאריכים אחרי 1 במרץ דוד יחזור אליך עם מחיר',
  sat_only: 'ליל שבת לבד: דוד נותן מחיר',
  long_stay: 'שהות ארוכה: דוד נותן מחיר',

/* ===== הדירות והעובדות (מהשיחות האמיתיות של דוד) ===== */
const APTS = {
  '1': { name: 'קו המים 1', sub: 'זוגית · קומה 5 · ג׳קוזי במרפסת מול הים', pics: [1,2,3,4,5,6].map((i) => '../p/all1-' + i + '.jpg'),
    about: 'קו המים 1 😍 קומה 5 בקו ראשון לים, נוף פנורמי.\nג׳קוזי פרטי במרפסת מול הים, מטבח מאובזר ומכונת אספרסו. מושלם לזוג.' },
  '2': { name: 'קו המים 2', sub: 'סוויטת בוטיק זוגית · ג׳קוזי 14 זרמים', pics: [1,2,3,4,5,6,7,8,9].map((i) => '../p/all2-' + i + '.jpg'),
    about: 'קו המים 2 🤍 סוויטת בוטיק מול חוף סירונית.\nג׳קוזי זוגי חדש עם 14 זרמים, מקלחת שקופה ומקלחת חיצונית מול הים.' },
  '3': { name: 'קו המים 3', sub: 'משפחתית · 2 חדרים · עד זוג + 2 ילדים + תינוק', pics: [1,2,3,4,5,6,7].map((i) => '../p/all3-' + i + '.jpg'),
    about: 'קו המים 3 🏖️ הסוויטה המשפחתית, הכי מטורפת.\n2 חדרי שינה וסלון, מרפסת ענקית עם ג׳קוזי מול הים, מטבח מאובזר ופינת אוכל ל-4.' },
};
const FAQ = [
  ['🚗 חנייה', 'אין חנייה פרטית לבניין. יש חניון כחול-לבן קצת אחרי הבניין, וחניון פרטי קצת לפני הבניין על הסיבוב. תדבר איתו, יעשה לך מחיר טוב 🚗', /חני|לחנות|רכב|אוטו/],
  ['🔑 כניסה ויציאה', 'כניסה בדרך כלל מ-15:00-16:00 (ביום ההגעה דוד מעדכן אם אפשר להקדים). יציאה עד 11:00-12:00, ובסופ"ש יוצאים במוצ"ש 😊\nהכניסה עצמית, עם כספת מפתחות ליד הדלת.', /כניסה|יציאה|צ'?ק|מתי נכנסים|מפתח/],
  ['🚬 עישון', 'בתוך הדירה אסור לעשן 🙏 במרפסת מול הים מותר.', /עישון|לעשן|סיגר|נרגיל|אייקוס/],
  ['🍳 ארוחת בוקר', 'ארוחת בוקר במסעדה בלובי הבניין, כל יום חוץ משבת. בערך 142 ₪ לזוג, אחרי 10% הנחה ללקוחות שלנו 🍳', /ארוחת בוקר|בוקר/],
  ['💳 תשלום ומקדמה', 'לסגירה מעבירים חצי מקדמה בפייבוקס או ביט, ואת השאר אפשר בהגעה. צריך צילום תעודת זהות (בבקשת המשטרה, כמו בכל מלון). אפשר קבלה.', /מקדמה|תשלום|לשלם|ביט|פייבוקס|אשראי|קבלה/],
  ['🕍 כשרות ובית חב״ד', 'בלובי של קו המים 3 יש בית חב״ד ומסעדות כשרות למהדרין. המטבחים בדירות לא מוכשרים.', /כשר|שבת|חב"?ד|בית כנסת/],
  ['🧹 ניקיון', 'אל תדאג, אני ואשתי מנקים לפני כל אורח ✨', /ניקיון|נקי|מצעים|מגבות/],
  ['📍 איפה זה?', 'קו ראשון לים במרכז נתניה, ליד חוף סירונית 🌊 הכתובת המדויקת ופרטי ההגעה נשלחים אחרי המקדמה.', /איפה|כתובת|מיקום|חוף/],
];
const EXTRAS = ['🎈 סידור בלונים', '💆 מסאז׳ זוגי', '🍷 בקבוק יין', '🍳 ארוחת בוקר בלובי'];

/* ===== תאריכים ===== */
const DAY = 864e5, TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
const DOWN = { 'ראשון': 0, 'שני': 1, 'שלישי': 2, 'רביעי': 3, 'חמישי': 4, 'שישי': 5, 'שבת': 6 };
const DN = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dm = (d) => d.getDate() + '/' + (d.getMonth() + 1);
function nextDow(dow, minAhead = 1) { const d = new Date(TODAY); d.setDate(d.getDate() + minAhead); while (d.getDay() !== dow) d.setDate(d.getDate() + 1); return d; }
const MONTHS = [['ינואר'], ['פברואר'], ['מרץ', 'מרס'], ['אפריל'], ['מאי'], ['יוני'], ['יולי'], ['אוגוסט'], ['ספטמבר'], ['אוקטובר'], ['נובמבר'], ['דצמבר']];
const MONTH_RE = MONTHS.flat().join('|'), monthIdx = (w) => MONTHS.findIndex((a) => a.includes(w));
function mkDate(day, month) { if (!(day >= 1 && day <= 31) || month < 0 || month > 11) return null; let d = new Date(TODAY.getFullYear(), month, day, 12); if (d.getMonth() !== month) return null; if (d < TODAY) d = new Date(TODAY.getFullYear() + 1, month, day, 12); return d; }
const DOW_RE = 'ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת', END_RE = DOW_RE + '|מוצ"?ש|מוצאי שבת|מוצאש';
function parseDates(raw) {
  const t = ' ' + raw.replace(/[״]/g, '"').replace(/[׳]/g, "'") + ' ';
  let m;
  if ((m = t.match(new RegExp('(?:^|\\s)(?:מ|מיום |יום |ב)?(' + DOW_RE + ')(?:\\s+(?:הזה|הקרוב|הבא))?\\s*(?:-|–|עד|ל|ועד)\\s*(?:יום |ה|ל)?(' + END_RE + ')')))) {
    const sd = DOWN[m[1]], ed = /מוצ/.test(m[2]) ? 6 : DOWN[m[2]];
    const start = nextDow(sd, /הבא|בעוד שבוע/.test(t) ? 6 : (TODAY.getDay() === sd ? 0 : 1));
    return { start, nights: ((ed - sd) + 7) % 7 || 7 };
  }
  const D = '(\\d{1,2})', SEP = '\\s*(?:-|–|עד|ל|ועד)\\s*(?:ה)?-?\\s*', PRE = '(?:ב|ל|של)?-?\\s*';
  if ((m = t.match(new RegExp(D + SEP + D + '\\s*' + PRE + '(' + MONTH_RE + ')')))) { const mo = monthIdx(m[3]), a = mkDate(+m[1], mo); if (a) { const b = new Date(a.getFullYear(), mo, +m[2], 12); if (b > a) return { start: a, nights: Math.round((b - a) / DAY) }; } }
  if ((m = t.match(/(\d{1,2})[\/.](\d{1,2})\s*(?:-|–|עד|ל)\s*(\d{1,2})[\/.](\d{1,2})/))) { const a = mkDate(+m[1], +m[2] - 1); let b = a && mkDate(+m[3], +m[4] - 1); if (a && b) { if (b <= a) b = new Date(b.getFullYear() + 1, b.getMonth(), b.getDate(), 12); return { start: a, nights: Math.round((b - a) / DAY) }; } }
  if ((m = t.match(new RegExp('(?:ה-?)?' + D + '\\s*' + PRE + '(' + MONTH_RE + ')')))) { const a = mkDate(+m[1], monthIdx(m[2])); if (a) return { start: a }; }
  if ((m = t.match(/(\d{1,2})[\/.](\d{1,2})(?![\/.]?\d)/))) { const a = mkDate(+m[1], +m[2] - 1); if (a) return { start: a }; }
  if ((m = t.match(new RegExp('(?:^|\\s)(?:ב|מ)?(' + DOW_RE + ')(?:\\s|$)')))) return { start: nextDow(DOWN[m[1]], TODAY.getDay() === DOWN[m[1]] ? 0 : 1) };
  return null;
}
function nightsOf(start, n) { const a = []; for (let i = 0; i < n; i++) { const d = new Date(start.getTime() + i * DAY); a.push({ dow: d.getDay(), iso: iso(d) }); } return a; }
function datesText() {
  const s = S.start, e = new Date(s.getTime() + S.nights * DAY);
  const end = e.getDay() === 6 ? 'מוצ"ש ' + dm(e) : DN[e.getDay()] + ' ' + dm(e);
  return `${DN[s.getDay()]} ${dm(s)} עד ${end} (${S.nights === 1 ? 'לילה אחד' : S.nights + ' לילות'})`;
}

/* ===== ממשק וואטסאפ ===== */
const chat = document.getElementById('chat'), sheet = document.getElementById('sheet'), dim = document.getElementById('dim'), st = document.getElementById('st');
const now = () => new Date().toTimeString().slice(0, 5);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const scroll = () => requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
function lockOld() { chat.querySelectorAll('.bt,.lb').forEach((b) => b.disabled = true); }
function me(text) { lockOld(); const d = document.createElement('div'); d.className = 'b out'; d.innerHTML = esc(text) + `<div class="ts">${now()} ✓✓</div>`; chat.appendChild(d); scroll(); }
let busy = false; const queue = [];
function bot(text, opt = {}) { queue.push([text, opt]); if (!busy) pump(); }
function pump() {
  if (!queue.length) { busy = false; st.textContent = 'דירות נופש בקו ראשון לים, נתניה'; return; }
  busy = true; const [text, opt] = queue.shift();
  const ty = document.createElement('div'); ty.className = 'typing'; ty.innerHTML = '<i></i><i></i><i></i>'; chat.appendChild(ty); st.textContent = 'מקליד/ה...'; scroll();
  setTimeout(() => { ty.remove(); render(text, opt); setTimeout(pump, 250); }, Math.min(1700, 650 + (text || '').length * 9));
}
function render(text, opt) {
  if (opt.pics) { const d = document.createElement('div'); d.className = 'b in pics'; d.innerHTML = '<div class="grid">' + opt.pics.map((p) => `<img src="${p}" alt="" loading="lazy">`).join('') + `</div><div class="ts">${now()}</div>`; chat.appendChild(d); }
  if (opt.owner) { const w = document.createElement('div'); w.className = 'owner'; w.innerHTML = '<h4>📲 ככה דוד מקבל את זה בוואטסאפ שלו:</h4>'; const d = document.createElement('div'); d.className = 'b in'; d.innerHTML = text + `<div class="ts">${now()}</div>`; w.appendChild(d); chat.appendChild(w); if (opt.buttons) addButtons(opt.buttons, w); scroll(); return; }
  if (text) {
    const d = document.createElement('div'); d.className = 'b in'; d.innerHTML = text + `<div class="ts">${now()}</div>`;
    if (opt.list) { const b = document.createElement('button'); b.type = 'button'; b.className = 'lb'; b.textContent = '☰ ' + opt.list.title; b.onclick = () => openList(opt.list); d.appendChild(b); }
    chat.appendChild(d);
  }
  if (opt.buttons) addButtons(opt.buttons, chat);
  scroll();
}
function addButtons(btns, parent) { const w = document.createElement('div'); w.className = 'btns'; btns.forEach(([label, fn]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'bt'; b.textContent = label; b.onclick = () => { me(label); fn(); }; w.appendChild(b); }); parent.appendChild(w); }
function openList(list) {

    list.rows.map((r, i) => `<div class="row ${list.multi ? 'chk' : ''}" data-i="${i}"><div><b>${r[0]}</b>${r[1] ? `<small>${r[1]}</small>` : ''}</div><span class="rad"></span></div>`).join('') +
    (list.multi ? '<button class="done" type="button">✅ סיימתי לבחור</button>' : '') + `<div class="hint">${list.multi ? 'אפשר לבחור כמה' : 'צריך להקיש על פריט כדי לבחור אותו'}</div>`;
  const close = () => { sheet.classList.remove('on'); dim.classList.remove('on'); };
  sheet.querySelector('.sh-x').onclick = close; dim.onclick = close;
  sheet.querySelectorAll('.row').forEach((row) => row.onclick = () => {
    const i = +row.dataset.i;
    if (list.multi) { sel.has(i) ? sel.delete(i) : sel.add(i); row.classList.toggle('sel'); return; }
    row.classList.add('sel'); setTimeout(() => { close(); me(list.rows[i][0]); list.rows[i][2](); }, 160);
  });
  if (list.multi) sheet.querySelector('.done').onclick = () => { close(); const picked = [...sel].sort().map((i) => list.rows[i][0]); me(picked.length ? picked.join(' + ') : 'בלי תוספות'); list.onDone(picked); };
  sheet.classList.add('on'); dim.classList.add('on');
}

  bot('במה אפשר לעזור עם ההזמנה?', { list: { title: 'הזמנה קיימת', rows: [

    ['🗺️ פרטי הגעה וקוד כניסה', '', go('arrive')], ['🕓 כניסה מוקדמת / יציאה מאוחרת', '', go('early')], ['✍️ משהו אחר', '', go('other')],
  ] } }); }
function exStep(type) {
  const n = esc(S.name);
  if (type === 'date') return askText('לאיזה תאריך תרצו לעבור? (למשל: חמישי עד מוצ"ש הבא) 📅', (t) => { const d = parseDates(t); owner('בקשה לשינוי תאריך', ['👤 ' + n, '📅 תאריך חדש: ' + esc(t) + (d && d.start ? ` (${DN[d.start.getDay()]} ${dm(d.start)})` : '')]); bot('רשמתי 🙏 דוד צריך לבדוק אם התאריך החדש פנוי, והוא יחזור אליך בהקדם.', { buttons: endBtns() }); });
  if (type === 'cancel') return bot('חבל 😔 נשמח לנסות להזיז לתאריך אחר במקום לבטל. מה תעדיפו?', { buttons: [['📅 להזיז תאריך', () => exStep('date')], ['❌ לבטל בכל זאת', () => { owner('בקשה לביטול הזמנה', ['👤 ' + n]); bot('העברתי לדוד 🙏 הוא יחזור אליך בהקדם עם כל הפרטים.', { buttons: endBtns() }); }]] });
  if (type === 'extras') return bot('מה להוסיף? 🎁', { list: { title: 'תוספות להזמנה', multi: true, rows: EXTRAS.map((e) => [e, '', null]), onDone: (picked) => { if (!picked.length) return menu(); owner('תוספות להזמנה קיימת', ['👤 ' + n, '🎁 ' + picked.join(', ')]); bot('מעולה 🎉 העברתי לדוד, והוא יאשר לך את התוספות והמחיר.', { buttons: endBtns() }); } } });
  if (type === 'arrive') return bot('את הכתובת, קוד הכספת וכל פרטי ההגעה דוד שולח ביום ההגעה, כשהדירה מוכנה 🔑\nהכניסה עצמית, עם כספת מפתחות ליד הדלת.', { buttons: [['👍 מעולה, תודה', menu], ['👤 לשאול את דוד', talkDavid]] });
  if (type === 'early') return bot('מה תרצו?', { buttons: [['🌅 כניסה מוקדמת', () => { owner('בקשה לכניסה מוקדמת', ['👤 ' + n]); bot('רשמתי 🙏 ביום ההגעה דוד מעדכן אם אפשר להקדים.', { buttons: endBtns() }); }], ['🌙 יציאה מאוחרת', () => { owner('בקשה ליציאה מאוחרת', ['👤 ' + n]); bot('רשמתי 🙏 דוד יבדוק אם יש אורחים אחריכם ויעדכן.', { buttons: endBtns() }); }]] });
  return askText('תכתבו מה צריך ✍️', (t) => { owner('בקשה על הזמנה קיימת', ['👤 ' + n, '💬 "' + esc(t) + '"']); bot('העברתי לדוד 🙏 הוא יחזור אליך בהקדם.', { buttons: endBtns() }); });
}
function review() { S.stage = 'menu'; const r = (stars) => () => {
    if (stars >= 4) { owner('ביקורת חדשה ' + '⭐'.repeat(stars), []); return bot('איזה כיף לשמוע 🥰 תודה!\nנשמח מאוד אם תכתבו לנו גם בגוגל, זה עוזר לנו המון 🙏\n👉 <u>כאן יופיע הקישור לביקורת בגוגל של קו המים</u>', { buttons: [['🏖️ להזמין שוב', pickApt], ['🏠 לתפריט הראשי', menu]] }); }
    askText('מצטערים לשמוע 😔 מה היה לא בסדר? דוד רוצה לדעת ולתקן:', (t) => { owner('משוב מלקוח ' + '⭐'.repeat(stars), ['💬 "' + esc(t) + '"']); bot('תודה שסיפרת 🙏 העברתי לדוד, והוא יחזור אליך אישית.', { buttons: [['🏠 לתפריט הראשי', menu]] }); }); };
  bot('איך היה אצלנו? ⭐', { list: { title: 'איך היה?', rows: [['⭐⭐⭐⭐⭐ מושלם', '', r(5)], ['⭐⭐⭐⭐ טוב מאוד', '', r(4)], ['⭐⭐⭐ בסדר', '', r(3)], ['⭐⭐ לא משהו', '', r(2)], ['⭐ לא טוב', '', r(1)]] } }); }
function toDavid(t) { askNameThen(() => { owner('שאלה מלקוח', ['👤 ' + esc(S.name), '💬 "' + esc(t) + '"']); bot('העברתי לדוד 🙏 הוא יענה לך כאן בהקדם.', { buttons: endBtns() }); }, 'אעביר לדוד 🙏 איך קוראים לך?'); }
function notUnderstood(t) { bot('את זה עדיף שדוד יענה בעצמו 🙏 להעביר לו את ההודעה?', { buttons: [['👤 כן, להעביר לדוד', () => toDavid(t)], ['❓ שאלות נפוצות', () => faq()], ['🏠 לתפריט הראשי', menu]] }); }

/* טקסט חופשי */
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault(); const inp = document.getElementById('t'), text = inp.value.trim(); if (!text) return; inp.value = ''; me(text);
  const t = text;
  if (S.stage === 'start') return welcome();
  if (S.stage === 'nameFor') { if (t.length < 2 || /\d{3}|\?/.test(t)) return bot('איך קוראים לך? (שם פרטי ושם משפחה) 😊'); S.name = t.slice(0, 40); S.stage = 'menu'; return S.nameCb(); }
  if (S.stage === 'talk') { S.stage = 'menu'; return toDavid(t.slice(0, 200)); }
  if (S.stage === 'textFor') { S.stage = 'menu'; return S.textCb(t.slice(0, 200)); }
  if (S.stage === 'name' && !/\?|חני|כניס|מחיר|עישון/.test(t)) { if (t.length < 2 || /\d{3}/.test(t)) return bot('על איזה שם לרשום? (שם פרטי ושם משפחה) 😊'); S.name = t.slice(0, 40); return askPay(); }
  if (S.stage === 'occasionText') { S.occasion = t.slice(0, 40); return goOn(askExtras); }
  if (S.stage === 'freeQ') { S.freeQ.push(t.slice(0, 120)); bot('רשמתי, ודוד יענה לך על זה בהקדם 👍'); return S.resume ? backTo() : menu(); }
  if (S.stage === 'davidName') { bot('📥 <b>מישהו רוצה לדבר איתך</b>\n💬 "' + esc(t.slice(0, 120)) + '"\n📞 052-1234567', { owner: true }); bot('תודה! 🙏 העברתי לדוד, והוא יחזור אליך בהקדם.', { buttons: [['🏠 לתפריט הראשי', menu]] }); S.stage = 'menu'; return; }
  if (S.stage === 'bigCount') { S.big = t.slice(0, 60); S.stage = 'bigName'; return bot('רשמתי ✍️ ומה חשוב לכם? (בריכה, כשרות, קרוב לים, חניה) ועל איזה שם לרשום?'); }
  if (S.stage === 'bigName') { S.stage = 'done'; bot('תודה! 🙏 רשמתי הכל, ודוד בודק עם החברים וחוזר אליך עם המלצה.'); return bot(`📥 <b>פנייה למשפחה גדולה (לחברים)</b>\n👥 ${esc(S.big)}\n📅 ${S.start ? datesText() : 'עוד לא נבחר'}\n📝 ${esc(t.slice(0, 120))}\n📞 052-1234567`, { owner: true, buttons: [['🏠 לתפריט הראשי', menu], ['🔄 לנסות שוב מההתחלה', () => { reset(); welcome(); }]] }); }
  if (S.stage === 'guestsText') { const n = (t.match(/\d+/g) || []).map(Number); const sum = n.reduce((a, b) => a + b, 0); if (sum > 5 || (n[0] || 0) > 2) { S.big = t; S.stage = 'bigName'; return bot('איזה כיף! 🙌 לכמה אנשים הדירות שלנו קטנות, אבל יש לנו חברים עם מקומות גדולים. מה חשוב לכם, ועל איזה שם לרשום?'); } return setGuests(t, Math.max(0, sum - 2), 0); }
  const f = FAQ.findIndex((x) => x[2].test(t)); if (f >= 0) { S.resume = S.resume || (['aptShown', 'summary'].includes(S.stage) ? S.stage : null); return answer(f); }
  if (['dates', 'confirmDates', 'nights', 'aptShown'].includes(S.stage) || /עד|מוצ|\d/.test(t)) {
    const d = parseDates(t);
    if (d && d.start) { S.start = d.start; S.nights = d.nights || null; if (!S.apt) { bot('רשמתי את התאריך 📅 איזו דירה?'); return pickApt(); } return S.nights ? confirmDates() : askNights(); }
    if (S.stage === 'dates') return bot('לא בטוח שהבנתי את התאריך 🙏 תכתבו למשל: <i>חמישי עד מוצ"ש</i> או <i>3 עד 5 בינואר</i>');
  }
  if (/^(היי|הי|שלום|אהלן|מה נשמע|בוקר טוב|ערב טוב)/.test(t)) return S.stage === 'menu' ? menu() : welcome();
  if (/תפריט|התחלה/.test(t)) return menu();
  if (/(דירה|קו המים)\s*([123])/.test(t)) return showApt(t.match(/([123])/)[1]);
  if (/להזמין|הזמנה|פנוי|סופ"?ש/.test(t)) return pickApt();
  if (/מחיר|כמה עולה|עלות/.test(t)) return prices();
  notUnderstood(t.slice(0, 200));
};
document.getElementById('reset').onclick = () => { reset(); welcome(); };
chat.addEventListener('click', (e) => { if (e.target.tagName === 'IMG') { document.getElementById('lbimg').src = e.target.src; document.getElementById('lbx').classList.add('on'); } });
document.getElementById('lbx').onclick = () => document.getElementById('lbx').classList.remove('on');
reset();
setTimeout(() => { me('היי, רציתי לשאול על הדירה'); welcome(); }, 500);
</script>
</body>
