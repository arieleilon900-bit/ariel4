<script>
/* ===== המחירון האמיתי של דוד (אותו קוד כמו בבוט), תקף עד 1/3/2027 ===== */
const DAVID_PRICES = {
  1: { one: 800, two: 600, thu: 1000, fm: 1500, fs: 1700, tm: 2200, kid: 0 },
  2: { one: 900, two: 700, thu: 1200, fm: 1500, fs: 1700, tm: 2200, kid: 0 },
  3: { one: 1200, two: 1000, thu: 1400, fm: 1700, fs: 2000, tm: 2600, kid: 100 },
};
const PRICES_VALID_UNTIL = '2027-03-01';
function priceStay(p, nights, { kids = 0, todayIso = '' } = {}) {
  const flags = [], lines = [];
  if (!nights.length) return { total: 0, lines, flags: ['no_nights'] };
  if (nights.some((n) => n.iso >= PRICES_VALID_UNTIL)) return { total: null, lines, flags: ['after_valid'] };
  if (nights.length > 6) return { total: null, lines, flags: ['long_stay'] };
  const mid = nights.filter((n) => n.dow <= 3), has = (d) => nights.some((n) => n.dow === d);
  const thu = has(4), fri = has(5), sat = has(6);
  let total = 0;
  if (thu && fri && sat) { const v = p.tm + (p.fs - p.fm); lines.push({ label: 'חמישי עד ראשון', price: v }); total += v; flags.push('thu_to_sun'); }
  else if (thu && fri) { lines.push({ label: 'חמישי עד מוצ"ש', price: p.tm }); total += p.tm; }
  else if (fri && sat) { lines.push({ label: 'שישי עד ראשון', price: p.fs }); total += p.fs; }
  else if (fri) { lines.push({ label: 'שישי עד מוצ"ש', price: p.fm }); total += p.fm; }
  else if (thu) { lines.push({ label: 'חמישי', price: p.thu }); total += p.thu; }
  else if (sat) { flags.push('sat_only'); return { total: null, lines, flags }; }
  if (mid.length) {
    const rate = nights.length >= 2 ? p.two : p.one;
    lines.push({ label: mid.length === 1 ? 'לילה באמצע שבוע' : `${mid.length} לילות באמצע שבוע`, price: rate * mid.length });
    total += rate * mid.length;
    if (thu || fri || sat) flags.push('mixed');
  }
  if (p.kid && kids > 0) { const v = p.kid * kids * nights.length; lines.push({ label: `תוספת ${kids === 1 ? 'ילד' : kids + ' ילדים'}`, price: v }); total += v; }
  if (nights.length >= 3) flags.push('extra_discount_3plus');
  if (todayIso && nights[0].iso <= todayIso) flags.push('last_minute');
  return { total, lines, flags };
}

const MONTH_RE = MONTHS.flat().join('|'), monthIdx = (w) => MONTHS.findIndex((a) => a.includes(w));
function mkDate(day, month) { if (!(day >= 1 && day <= 31) || month < 0 || month > 11) return null; let d = new Date(TODAY.getFullYear(), month, day, 12); if (d.getMonth() !== month) return null; if (d < TODAY) d = new Date(TODAY.getFullYear() + 1, month, day, 12); return d; }
const DOW_RE = 'ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת', END_RE = DOW_RE + '|מוצ"?ש|מוצאי שבת|מוצאש';
function parseDates(raw) {
  const t = ' ' + raw.replace(/[״]/g, '"').replace(/[׳]/g, "'") + ' ';
  let m;
  if ((m = t.match(new RegExp('(?:^|\\s)(?:מ|מיום |יום |ב)?(' + DOW_RE + ')(?:\\s+(?:הזה|הקרוב|הבא))?\\s*(?:-|–|עד|ל|ועד)\\s*(?:יום |ה|ל)?(' + END_RE + ')')))) {
    const sd = DOWN[m[1]], ed = /מוצ/.test(m[2]) ? 6 : DOWN[m[2]];
    const start = nextDow(sd, /הבא|בעוד שבוע/.test(t) ? 6 : (TODAY.getDay() === sd ? 0 : 1));
    return { start, nights: ((ed - sd) + 7) % 7 || 7 };
  }
  const D = '(\\d{1,2})', SEP = '\\s*(?:-|–|עד|ל|ועד)\\s*(?:ה)?-?\\s*', PRE = '(?:ב|ל|של)?-?\\s*';
  if ((m = t.match(new RegExp(D + SEP + D + '\\s*' + PRE + '(' + MONTH_RE + ')')))) { const mo = monthIdx(m[3]), a = mkDate(+m[1], mo); if (a) { const b = new Date(a.getFullYear(), mo, +m[2], 12); if (b > a) return { start: a, nights: Math.round((b - a) / DAY) }; } }
  if ((m = t.match(/(\d{1,2})[\/.](\d{1,2})\s*(?:-|–|עד|ל)\s*(\d{1,2})[\/.](\d{1,2})/))) { const a = mkDate(+m[1], +m[2] - 1); let b = a && mkDate(+m[3], +m[4] - 1); if (a && b) { if (b <= a) b = new Date(b.getFullYear() + 1, b.getMonth(), b.getDate(), 12); return { start: a, nights: Math.round((b - a) / DAY) }; } }
  if ((m = t.match(new RegExp('(?:ה-?)?' + D + '\\s*' + PRE + '(' + MONTH_RE + ')')))) { const a = mkDate(+m[1], monthIdx(m[2])); if (a) return { start: a }; }
  if ((m = t.match(/(\d{1,2})[\/.](\d{1,2})(?![\/.]?\d)/))) { const a = mkDate(+m[1], +m[2] - 1); if (a) return { start: a }; }
  if ((m = t.match(new RegExp('(?:^|\\s)(?:ב|מ)?(' + DOW_RE + ')(?:\\s|$)')))) return { start: nextDow(DOWN[m[1]], TODAY.getDay() === DOWN[m[1]] ? 0 : 1) };
  return null;
}

  bot('אילו ימים?', { list: { title: 'בחירת ימים', rows: [['חמישי עד מוצ״ש', '2 לילות', set(th, 2)], ['שישי עד מוצ״ש', 'לילה אחד', set(fr, 1)], ['שישי עד ראשון', '2 לילות', set(fr, 2)], ['אחר', 'כותבים, למשל "חמישי עד ראשון"', () => { S.stage = 'datesText'; S.cur = () => bot('אילו ימים? למשל <i>חמישי עד ראשון</i> או <i>רביעי עד מוצ"ש</i>'); S.cur(); }]] } }); }
function confirmDates() { S.stage = 'confirmDates'; bot(datesText() + '.\nנכון?', { buttons: [['נכון', () => goOn(askGuests)], ['לשנות תאריך', () => ask(askDates)]] }); }
function askNights() { S.stage = 'nights'; bot(`הגעה ב${DN[S.start.getDay()]} ${dm(S.start)}. לכמה לילות?`, { buttons: [1, 2, 3].map((n) => [n === 1 ? 'לילה אחד' : n + ' לילות', () => { S.nights = n; ask(confirmDates); }]) }); }
/* 4. אורחים */
function askGuests() { S.stage = 'guests';
  bot('כמה אורחים תהיו?', { list: { title: 'בחירת אורחים', rows: [
    ['זוג', '', () => setGuests('זוג', 0, 0)], ['זוג + תינוק', 'תינוק בלי תוספת מחיר', () => setGuests('זוג + תינוק', 0, 1)],
    ['זוג + ילדים', 'עד 2 ילדים + תינוק', () => ask(askKids)], ['קבוצה גדולה', 'יותר מזוג + 2 ילדים', bigGroup],
    ['אחר', 'כותבים כמה מבוגרים וכמה ילדים', () => { S.stage = 'guests'; S.cur = () => bot('כמה מבוגרים וכמה ילדים? למשל <i>2 מבוגרים וילד</i>'); S.cur(); }],
  ] } }); }
function askKids() { S.stage = 'kids'; bot('כמה ילדים?', { buttons: [['ילד אחד', () => setGuests('זוג + ילד', 1, 0)], ['2 ילדים', () => setGuests('זוג + 2 ילדים', 2, 0)], ['אחר', () => { S.stage = 'kids'; S.cur = () => bot('כמה ילדים, ויש גם תינוק? למשל <i>2 ילדים ותינוק</i>'); S.cur(); }]] }); }
function setGuests(label, kids, baby) { S.guests = label; S.kids = kids; S.baby = baby; if (kids && S.apt !== '3') return ask(fitKids); goOn(askExtras); }
function fitKids() { bot(`${APTS[S.apt].name} זוגית. למשפחה עם ילדים מתאימה קו המים 3, עם 2 חדרי שינה. לעבור אליה?`, { buttons: [['לעבור לקו המים 3', () => { S.apt = '3'; bot('', { pics: APTS['3'].pics }); goOn(askExtras); }], ['לבחור דירה אחרת', () => ask(pickApt)]] }); }
function bigGroup() { S.stage = 'bigCount'; S.cur = () => bot('כמה אתם בסך הכל, מבוגרים וילדים?'); bot('הדירות שלנו מתאימות עד זוג + 2 ילדים + תינוק. אבל לדוד יש חברים עם וילות ודירות גדולות בנתניה, והוא ישמח לעזור.'); S.cur(); }
/* 5. תוספות + אירוע */
function askExtras() { S.stage = 'extras'; bot('רוצים להוסיף משהו לשהייה? אפשר לבחור כמה', { list: { title: 'בחירת תוספות', multi: true, rows: [
  ...EXTRAS.map((e) => [e, e.includes('ארוחת') ? 'במסעדה בלובי, כ-142 ₪ לזוג, חוץ משבת' : 'בתיאום עם דוד', null]),
  ['לכבוד אירוע מיוחד', 'יום הולדת, יום נישואין ועוד', null],
  ['משהו אחר', 'כותבים מה תרצו', null],
], onDone: (picked) => { S.extras = picked.filter((p) => !['לכבוד אירוע מיוחד', 'משהו אחר'].includes(p)); const ev = picked.includes('לכבוד אירוע מיוחד'); if (!ev) S.occasion = '';
  const next = () => (ev ? ask(askOccasion) : goOn());
  if (picked.includes('משהו אחר')) { S.stage = 'textFor'; S.textCb = (t) => { S.note = t; next(); }; return bot('מה עוד תרצו להוסיף?'); }
  next(); } } }); }
function askOccasion() { S.stage = 'occasion'; const o = (x) => () => { S.occasion = x; bot('מזל טוב! דוד ידאג שיהיה מושלם.'); goOn(); };
  bot('איזה אירוע חוגגים?', { buttons: [['יום הולדת', o('יום הולדת')], ['יום נישואין', o('יום נישואין')], ['משהו אחר', () => { S.stage = 'occasionText'; S.cur = () => bot('מה חוגגים?'); S.cur(); }]] }); }
/* 6. סיכום */
function quote() { return priceStay(DAVID_PRICES[S.apt], nightsOf(S.start, S.nights), { kids: S.apt === '3' ? S.kids : 0, todayIso: iso(TODAY) }); }
const nis = (n) => n.toLocaleString('he-IL') + ' ₪';
function summaryLines() {
  const q = quote();
  return [`<b>${APTS[S.apt].name}</b>`, datesText(), S.guests, S.extras.length ? 'תוספות: ' + S.extras.join(', ') + ' (בתיאום עם דוד)' : '', S.occasion ? 'אירוע: ' + esc(S.occasion) : '', S.note ? 'בקשה: ' + esc(S.note) : '',
    q.total != null ? `<b>מחיר: ${nis(q.total)}</b>\nמקדמה לשמירת התאריך: ${nis(Math.round(q.total / 2))} (חצי)` : '<b>מחיר: דוד יחזור אליך עם מחיר</b>',
    ...q.flags.filter((f) => FLAG_TEXT[f]).map((f) => FLAG_TEXT[f])].filter(Boolean).join('\n');
}
function summary() { S.stage = 'summary'; bot('<b>סיכום ההזמנה</b>\n\n' + summaryLines(), { buttons: [['להעביר לדוד', () => ask(askName)], ['לשנות פרטים', change], ['יש לי שאלה', faq]] }); }
function change() { const c = (fn) => () => { S.after = 'summary'; ask(fn); }; bot('מה לשנות?', { list: { title: 'שינוי פרטים', rows: [['דירה', '', c(pickApt)], ['תאריך', '', c(askDates)], ['אורחים', '', c(askGuests)], ['תוספות', '', c(askExtras)], ['משהו אחר', 'כותבים מה לשנות', () => { S.stage = 'textFor'; S.textCb = (t) => { S.note = (S.note ? S.note + ' · ' : '') + t; ask(summary); }; bot('מה תרצו לשנות או להוסיף?'); }]] } }); }
/* 7. שם + סיום */
function askName() { S.stage = 'name'; bot('על איזה שם לרשום?'); }
function finish() {
  S.stage = 'done'; S.cur = menu; const first = esc(S.name.split(' ')[0]);
  bot(`תודה ${first}! בקשת הזמנה <b>${REF}</b> נשלחה לדוד ✅\n\n` + summaryLines() + `\n\n<b>סטטוס:</b> ממתינה לאישור של דוד. התאריך נשמר אחרי המקדמה.\n<b>מה הלאה:</b> דוד חוזר אליך ${replyTime()} עם אישור ופרטי מקדמה.\n\nתודה שבחרתם בקו המים`, { buttons: [['תפריט ראשי', menu]] });
  bot(`<b>הזמנה חדשה ${REF}</b>\n${esc(S.name)} · 052-1234567\n\n` + summaryLines() + '\n\nזמינות: לבדוק ביומן', { owner: true, buttons: [['לאשר ולשלוח מקדמה', () => bot(`(בבוט האמיתי ${first} מקבל מיד אישור וקישור למקדמה)`)], ['לפתוח צ׳אט', () => bot('(כאן דוד ממשיך בעצמו, והבוט שותק בשיחה הזו)')], ['להתחיל מחדש', () => { reset(); welcome(); }]] });
}

/* הזמנה קיימת */
function askNameThen(cb, q) { if (S.name) return cb(); S.stage = 'nameFor'; S.nameCb = cb; bot(q || 'על איזה שם?'); }
function askText(q, cb) { S.stage = 'textFor'; S.textCb = cb; bot(q); }
const doneMsg = () => bot(`קיבלתי, העברתי לדוד. הוא חוזר אליך ${replyTime()}.`, { buttons: [['תפריט ראשי', menu]] });
function existing() { S.cur = existing; const go = (type) => () => askNameThen(() => exStep(type), 'על איזה שם ההזמנה?');
  bot('במה אפשר לעזור עם ההזמנה?', { list: { title: 'הזמנה קיימת', rows: [
    ['לשנות תאריך', '', go('date')], ['לבטל', '', go('cancel')], ['להוסיף תוספת', 'בלונים, מסאז׳, יין, ארוחת בוקר', go('extras')],
    ['פרטי הגעה', 'קוד כניסה, חנייה', go('arrive')], ['כניסה או יציאה', 'כניסה מוקדמת / יציאה מאוחרת', go('early')], ['משהו אחר', '', go('other')],
  ] } }); }
function exStep(type) {
  const n = esc(S.name); S.stage = 'menu'; S.cur = menu;
  if (type === 'date') return askText('לאיזה תאריך תרצו לעבור? אפשר במילים, למשל <i>שישי עד מוצ"ש הבא</i>', (t) => { const d = parseDates(t); owner('בקשה לשינוי תאריך', [n, 'תאריך חדש: ' + esc(t) + (d && d.start ? ` (${DN[d.start.getDay()]} ${dm(d.start)})` : '')]); bot('רשמתי. דוד בודק אם התאריך החדש פנוי.'); doneMsg(); });
  if (type === 'cancel') return bot('חבל. אפשר להזיז לתאריך אחר במקום לבטל. מה תעדיפו?', { buttons: [['להזיז תאריך', () => exStep('date')], ['לבטל בכל זאת', () => { owner('בקשה לביטול הזמנה', [n]); doneMsg(); }]] });
  if (type === 'extras') return bot('מה להוסיף?', { list: { title: 'תוספות להזמנה', multi: true, rows: EXTRAS.map((e) => [e, '', null]), onDone: (picked) => { if (!picked.length) return menu(); owner('תוספות להזמנה קיימת', [n, picked.join(', ')]); doneMsg(); } } });
  if (type === 'arrive') return bot('את הכתובת, קוד הכספת וכל פרטי ההגעה דוד שולח ביום ההגעה, כשהדירה מוכנה. הכניסה עצמית, עם כספת מפתחות ליד הדלת.', { buttons: [['תודה', menu], ['יש לי שאלה', faq]] });
  if (type === 'early') return bot('מה תרצו?', { buttons: [['כניסה מוקדמת', () => { owner('בקשה לכניסה מוקדמת', [n]); bot('רשמתי. ביום ההגעה דוד מעדכן אם אפשר להקדים.', { buttons: [['תפריט ראשי', menu]] }); }], ['יציאה מאוחרת', () => { owner('בקשה ליציאה מאוחרת', [n]); bot('רשמתי. דוד בודק אם יש אורחים אחריכם ומעדכן.', { buttons: [['תפריט ראשי', menu]] }); }], ['אחר', () => exStep('other')]] });
  return askText('מה צריך?', (t) => { owner('בקשה על הזמנה קיימת', [n, '"' + esc(t) + '"']); doneMsg(); });
}
/* ביקורת */
function review() { S.cur = review; const r = (s) => () => {
    if (s >= 4) { owner('ביקורת חדשה: ' + s + ' כוכבים', []); return bot('איזה כיף לשמוע, תודה!\nנשמח מאוד לביקורת קצרה בגוגל, זה עוזר לנו המון 🙏\n<u>כאן יופיע הקישור לביקורת בגוגל של קו המים</u>', { buttons: [['להזמין שוב', () => ask(pickApt)], ['תפריט ראשי', menu]] }); }
    askText('מצטערים לשמוע. מה היה לא בסדר? דוד רוצה לדעת ולתקן:', (t) => { owner('משוב מלקוח: ' + s + ' כוכבים', ['"' + esc(t) + '"']); bot('תודה שסיפרת. העברתי לדוד, והוא יחזור אליך אישית.', { buttons: [['תפריט ראשי', menu]] }); }); };
  bot('איך היה אצלנו?', { list: { title: 'דירוג', rows: [['מושלם ★★★★★', '', r(5)], ['טוב מאוד ★★★★', '', r(4)], ['בסדר ★★★', '', r(3)], ['לא משהו ★★', '', r(2)], ['לא טוב ★', '', r(1)]] } }); }
function where() { S.cur = menu; bot('קו ראשון לים במרכז נתניה, ליד חוף סירונית 🌊\nהכתובת המדויקת נשלחת עם אישור ההזמנה.', { buttons: [['להזמין חופשה', () => ask(pickApt)], ['תפריט ראשי', menu]] }); }
/* שאלות */
function faq() { const back = S.cur; bot('על מה השאלה?', { list: { title: 'שאלות', rows: [...FAQ.map((f, i) => [f[0], '', () => { bot(f[1]); back ? back() : menu(); }]), ['שאלה אחרת', 'דוד יענה', () => { S.stage = 'freeQ'; S.cur = back; bot('כתבו את השאלה, ואעביר לדוד:'); }]] } }); }
function resume(prefix) { if (prefix) bot(prefix); (S.cur || menu)(); }

/* טקסט חופשי */
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault(); const inp = document.getElementById('t'), t = inp.value.trim(); if (!t) return; inp.value = ''; me(t);
  if (S.stage === 'start') return welcome();
  if (S.stage === 'name' && !/\?/.test(t) && !FAQ.some((f) => f[2].test(t))) { if (t.length < 2 || /\d{3}/.test(t)) return bot('על איזה שם לרשום? שם פרטי ושם משפחה'); S.name = t.slice(0, 40); return finish(); }
  if (S.stage === 'nameFor') { if (t.length < 2 || /\d{3}|\?/.test(t)) return bot('איך קוראים לך? שם פרטי ושם משפחה'); S.name = t.slice(0, 40); S.stage = 'menu'; return S.nameCb(); }
  if (S.stage === 'textFor') { S.stage = 'menu'; return S.textCb(t.slice(0, 200)); }
  if (S.stage === 'occasionText') { S.occasion = t.slice(0, 40); bot('מזל טוב! דוד ידאג שיהיה מושלם.'); return goOn(); }
  if (S.stage === 'freeQ') { owner('שאלה מלקוח', [S.name ? esc(S.name) : '', '"' + esc(t.slice(0, 200)) + '"']); return resume(`העברתי לדוד, והוא יענה לך ${replyTime()}. בינתיים נמשיך:`); }
  if (S.stage === 'bigCount') { S.big = t.slice(0, 60); return askNameThen(() => { owner('קבוצה גדולה (להעביר לחברים)', [esc(S.name), esc(S.big), S.start ? datesText() : '']); S.stage = 'menu'; S.cur = menu; bot(`רשמתי הכל. דוד בודק עם החברים וחוזר אליך ${replyTime()} עם המלצה.`, { buttons: [['תפריט ראשי', menu]] }); }, 'ועל איזה שם לרשום?'); }
  // שאלה עם תשובה מוכנה: עונים וחוזרים לאותה שאלה
  const f = FAQ.findIndex((x) => x[2].test(t)); if (f >= 0) { bot(FAQ[f][1]); return resume(S.stage === 'menu' ? '' : 'ובינתיים, נמשיך:'); }
  // אורחים במילים
  if (['guests', 'kids'].includes(S.stage) || /מבוגר|ילד|זוג/.test(t) && S.apt && S.start) {
    const nums = (t.match(/\d+/g) || []).map(Number), words = { 'ילד': 1, 'ילדה': 1, 'שני ילדים': 2, 'שתי ילדות': 2 };
    let adults = /זוג/.test(t) ? 2 : (nums[0] || 2), kids = nums.length > 1 ? nums[1] : (/שני ילדים|2 ילדים|שתי/.test(t) ? 2 : /ילד/.test(t) ? 1 : 0); const baby = /תינוק/.test(t) ? 1 : 0;
    if (/מבוגר|ילד|זוג|תינוק/.test(t)) { if (adults > 2 || kids > 2) return bigGroup(); return setGuests(kids ? `זוג + ${kids === 1 ? 'ילד' : '2 ילדים'}${baby ? ' + תינוק' : ''}` : baby ? 'זוג + תינוק' : 'זוג', kids, baby); }
  }
  // תאריך במילים
  if (['dates', 'datesText', 'wkDays', 'confirmDates', 'nights', 'aptShown'].includes(S.stage) || /עד|מוצ|\d{1,2}[\/.]\d/.test(t)) {
    const d = parseDates(t);
    if (d && d.start) { S.start = d.start; S.nights = d.nights || null; if (!S.apt) { bot('רשמתי את התאריך. איזו דירה?'); return ask(pickApt); } return ask(S.nights ? confirmDates : askNights); }
    if (S.stage === 'datesText') return bot('לא הצלחתי להבין את התאריך. אפשר לכתוב למשל: <i>3 עד 5 בינואר</i> או <i>חמישי עד מוצ"ש</i>');
  }
  const apt = t.match(/(?:קו המים|דירה)\s*([123])/); if (apt) return showApt(apt[1]);
  if (/^(היי|הי|שלום|אהלן|בוקר טוב|ערב טוב)\b/.test(t)) return S.stage === 'menu' ? menu() : resume('היי! נמשיך מאיפה שעצרנו:');
  if (/^(תודה|אוקיי|אוקי|סבבה|יופי|מעולה|אחלה|מה נשמע|מה קורה|👍|🙏|😊|❤️)/.test(t)) return resume(/מה נשמע|מה קורה/.test(t) ? 'הכל טוב, תודה! נמשיך:' : 'בכיף 😊');
  if (/להזמין|הזמנה|פנוי|סופ"?ש/.test(t) && ['menu', 'start'].includes(S.stage)) return ask(pickApt);
  if (/מחיר|כמה עולה|עלות/.test(t) && !(S.apt && S.start)) { bot('המחיר תלוי בדירה ובימים. בוחרים דירה ותאריך, ומקבלים מחיר מדויק לפי המחירון.'); return S.stage === 'menu' ? ask(pickApt) : resume(''); }
  // משהו שהבוט לא מכיר: עובר לדוד, וממשיכים
  owner('הודעה מלקוח', [S.name ? esc(S.name) : '', '"' + esc(t.slice(0, 200)) + '"']);
  resume(`על זה עדיף שדוד יענה בעצמו. העברתי לו, והוא יחזור אליך ${replyTime()}.\nבינתיים נמשיך:`);
};
document.getElementById('reset').onclick = () => { reset(); welcome(); };

document.getElementById('lbclose').onclick = () => document.getElementById('lbx').classList.remove('on');
document.getElementById('lbp').onclick = () => showLb(ALI - 1); document.getElementById('lbn').onclick = () => showLb(ALI + 1);
let tx = null; const lbi = document.querySelector('.lbx-img'); lbi.addEventListener('touchstart', (e) => tx = e.touches[0].clientX); lbi.addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) showLb(ALI + (dx > 0 ? 1 : -1)); tx = null; });
const inpEl = document.getElementById('t'), formEl = document.getElementById('f'); inpEl.addEventListener('input', () => formEl.classList.toggle('typingnow', !!inpEl.value.trim()));
formEl.addEventListener('submit', () => setTimeout(() => formEl.classList.remove('typingnow'), 0));
document.getElementById('av').style.backgroundImage = 'url(' + APTS['1'].pics[1] + ')';
reset();
setTimeout(() => { me('היי, רציתי לשאול על הדירה'); welcome(); }, 500);
</script>
